services:
  qwenproxy:
    build: .
    container_name: qwenproxy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      API_KEY: "${API_KEY:?Set API_KEY in .env before starting Compose}"
    volumes:
      - ./qwen_profile:/app/qwen_profile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
